  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-family="'Space Grotesk', 'Outfit', 'Inter', sans-serif" font-weight="800" font-size="34" fill="url(#grad)" filter="url(#glow)">R</text>
  <circle cx="48" cy="46" r="3.5" fill="#f43f5e" />
